name: Flatten Super Cyphs 64 folders

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move unzip folders into repo root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob

          for dir in unzip1 unzip2 unzip3 unzip4 unzip5 zip6; do
            if [ -d "$dir" ]; then
              echo "Moving contents of $dir into repo root"
              cp -a "$dir"/. .
              rm -rf "$dir"
            else
              echo "Skipping $dir; folder not found"
            fi
          done

      - name: Commit flattened repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Flatten extracted source folders"
            git push
          fi